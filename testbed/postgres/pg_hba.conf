# pg_hba.conf for the thesis lab.
# Per Teleport's self-hosted PostgreSQL guide, Teleport authenticates with a
# client certificate whose CN is the Postgres role name, so every TCP connection
# must use `cert` auth over TLS. Local socket stays `trust` so that initdb,
# init.sql and pg_isready still work inside the container.
#
# TYPE     DATABASE  USER  ADDRESS     METHOD
local      all       all               trust
hostssl    all       all   0.0.0.0/0   cert
hostssl    all       all   ::/0        cert
# Plain (non-TLS) TCP is deliberately NOT permitted.
